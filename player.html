<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <title>D'Quest - Play</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c1ee81'/%3E%3Ctext x='32' y='44' font-size='36' font-weight='900' text-anchor='middle' fill='%23282d26'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/generation.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/home.css">
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head>
<body class="play-body">
  <header class="hud">
    <div class="hud-row">
      <a class="btn btn-sm btn-icon" href="index.html" aria-label="Home"><i data-lucide="home"></i></a>
      <div class="hud-info">
        <div class="hud-line"><span id="hud-progress">Loading</span><span>Score <b id="hud-score">0</b></span></div>
        <div class="hud-track"><div id="hud-bar" class="hud-fill"></div></div>
      </div>
      <button id="sound-btn" class="btn btn-sm" type="button" aria-pressed="false"><i data-lucide="volume-2"></i><span>Sound on</span></button>
    </div>
  </header>
  <main id="stage" aria-live="polite">
    <section class="screen center"><span class="spin-loader" style="width:32px;height:32px;border-width:3px"></span><p class="screen-sub">Loading quiz…</p></section>
  </main>
  <script src="js/lib/sfx.js"></script>
  <script type="module" src="js/play/main.js"></script>
</body>
</html>
