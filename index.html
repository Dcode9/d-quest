<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <title>D'Quest by Dhairya Shah</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c1ee81'/%3E%3Ctext x='32' y='44' font-size='36' font-weight='900' text-anchor='middle' fill='%23282d26'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/preview-builder.css">
  <link rel="stylesheet" href="css/live-theme.css">
  <!-- The live room module still renders with utility class names, so Tailwind stays for it only.
       Preflight is off and the palette is remapped to the paper theme. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: { extend: { colors: {
        slate: { 100: '#282d26', 200: '#2f352e', 300: '#3b423b', 400: '#74776b', 500: '#8a8d80', 600: '#aaa89a', 700: '#c9c7b8', 800: '#efeadd', 900: '#fffdf8' },
        yellow: { 300: '#4d7a12', 400: '#5f8f1a', 500: '#7fb02e' },
        red: { 400: '#d4573d' }, emerald: { 400: '#3f8a2f' }
      } } }
    };
  </script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.3/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="D'Quest home">
        <span class="brand-mark">D</span>
        <span class="brand-name">D'Quest</span><span class="beta-badge">Beta</span>
      </a>
      <div id="dverse-account" class="account">
        <span id="dverse-account-label" class="account-label">D'Verse</span>
        <button id="dverse-auth-button" type="button">Sign in</button>
      </div>
    </header>

    <main class="page">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="hero-title">Quiz <mark>anything</mark>, instantly.</h1>
        <p class="hero-sub">Search the quiz bank or let D'Ai write a fresh one from live sources. Play solo, or host a live room for friends.</p>
        <form id="search-form" class="search" role="search" autocomplete="off">
          <i data-lucide="search"></i>
          <input id="main-search" type="text" inputmode="search" enterkeyhint="search" aria-label="Search for a quiz topic or enter a 6 digit room PIN" placeholder="Try &quot;10 questions about Space&quot;">
          <button id="search-btn" class="btn btn-lime" type="submit" aria-label="Search or generate a quiz">Go</button>
        </form>
        <div class="quick">
          <button type="button" class="chip" data-prompt="10 questions about space">🚀 Space</button>
          <button type="button" class="chip" data-prompt="Grade 10 biology: human nervous system">🧬 Biology</button>
          <button type="button" class="chip" data-prompt="5 challenging questions about world geography">🌍 Geography</button>
          <button type="button" class="chip" data-prompt="History of ancient Rome">📜 History</button>
        </div>
        <div class="actions">
          <button id="join-live-btn" type="button" class="btn btn-purple"><i data-lucide="users"></i><span>Join live quiz</span></button>
          <button id="create-quiz-btn" type="button" class="btn"><i data-lucide="pencil-ruler"></i><span>Make your own quiz</span></button>
        </div>
      </section>

      <div id="status" hidden></div>

      <section id="results" hidden>
        <div class="results-bar">
          <h2 id="results-title" class="results-title"></h2>
          <button id="back-to-library" type="button" class="btn btn-sm"><i data-lucide="arrow-left"></i><span>All quizzes</span></button>
        </div>
        <div id="results-grid" class="grid-cards"></div>
      </section>

      <section id="library">
        <div id="hub-shelves"></div>
        <div class="section-head">
          <div><h2>Browse the library</h2><p id="library-count">Pick one and play, preview it, or host it live.</p></div>
        </div>
        <div class="filters">
          <div id="diff-filter" class="seg" role="group" aria-label="Difficulty">
            <button type="button" class="seg-btn is-on" data-diff="">All levels</button>
            <button type="button" class="seg-btn" data-diff="Easy">Easy</button>
            <button type="button" class="seg-btn" data-diff="Medium">Medium</button>
            <button type="button" class="seg-btn" data-diff="Hard">Hard</button>
          </div>
          <div id="topic-filter" class="topic-row" aria-label="Topics"></div>
        </div>
        <div id="library-grid" class="grid-cards"></div>
      </section>
    </main>
    <footer class="footer">Powered by D'Ai. Made by Dhairya Shah.</footer>
  </div>

  <script src="js/dverse-auth.js"></script>
  <script src="js/live.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
